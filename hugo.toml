baseURL      = "https://dbaelipro.github.io/hugo-with-comments/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title        = "FlowCon France"
theme        = "PaperMod"

enableRobotsTXT = true
enableGitInfo   = true
enableEmoji     = true

[permalinks]
  # default is fine; documented here for future tuning

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github"
    noClasses = false

[params]
  env = "production"
  description = "FlowCon France — la conférence francophone sur le Flow, le Lean et le management visuel."
  author = "FlowCon France"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs  = true
  comments = false

  [params.homeInfoParams]
    Title = "FlowCon France"
    Content = "La communauté francophone du Flow."

  # TODO (repo admin): replace placeholder IDs after running the one-time Giscus setup
  # documented in docs/giscus-setup.md
  [params.giscus]
    repo            = "dbaelipro/hugo-with-comments"
    repoId          = "REPLACE_WITH_REPO_ID"
    category        = "Site Comments"
    categoryId      = "REPLACE_WITH_CATEGORY_ID"
    mapping         = "pathname"
    strict          = "0"
    reactionsEnabled = "1"
    emitMetadata    = "0"
    inputPosition   = "bottom"
    theme           = "preferred_color_scheme"
    lang            = "fr"
    loading         = "lazy"

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/dbaelipro/hugo-with-comments"

[[menu.main]]
  identifier = "about"
  name       = "À propos"
  url        = "/about/"
  weight     = 10

[[menu.main]]
  identifier = "manifesto"
  name       = "Manifeste"
  url        = "/manifesto/"
  weight     = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
